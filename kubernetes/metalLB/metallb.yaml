apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: fritzbox-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.1.2-192.168.1.9

---

apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-first-pool
  namespace: metallb-system
spec:
  ipAddressPools:
  - fritzbox-pool
