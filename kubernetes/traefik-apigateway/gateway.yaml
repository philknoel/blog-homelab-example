apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: websecure
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      port: 8443
      hostname: "*.k8s.home.lab"
      tls:
        mode: Terminate
        certificateRefs:
          # This references the Secret generated by cert-manager
          - kind: Secret
            name: k8s-wildcard-tls
            